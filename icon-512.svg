<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#34D399"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <g transform="translate(256,240)">
    <!-- Гантель -->
    <rect x="-150" y="-20" width="300" height="40" rx="20" fill="url(#accent)"/>
    <rect x="-180" y="-65" width="60" height="130" rx="15" fill="url(#accent)"/>
    <rect x="120" y="-65" width="60" height="130" rx="15" fill="url(#accent)"/>
    <!-- Блик -->
    <rect x="-170" y="-55" width="40" height="20" rx="10" fill="white" opacity="0.3"/>
    <rect x="130" y="-55" width="40" height="20" rx="10" fill="white" opacity="0.3"/>
  </g>
  <!-- Текст FIT PRO -->
  <text x="256" y="420" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="white">FIT PRO</text>
</svg>
