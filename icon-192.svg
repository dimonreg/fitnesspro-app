<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#34D399"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <g transform="translate(96,96)">
    <!-- Гантель -->
    <rect x="-60" y="-8" width="120" height="16" rx="8" fill="url(#accent)"/>
    <rect x="-70" y="-25" width="25" height="50" rx="6" fill="url(#accent)"/>
    <rect x="45" y="-25" width="25" height="50" rx="6" fill="url(#accent)"/>
    <!-- Блик -->
    <rect x="-65" y="-20" width="15" height="8" rx="4" fill="white" opacity="0.3"/>
    <rect x="50" y="-20" width="15" height="8" rx="4" fill="white" opacity="0.3"/>
  </g>
  <!-- Текст FIT -->
  <text x="96" y="155" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="white">FIT</text>
</svg>
